spring.application.name=data-agent
server.port=8083

# 本地 PostgreSQL 业务库及登录凭据。
spring.datasource.url=jdbc:postgresql://localhost:5432/data_agent_v3
spring.datasource.username=data_agent
spring.datasource.password=data_agent_local_dev

# 本机 Ollama 使用 Responses API 流式接口，无需令牌。
agent.model.endpoint=http://localhost:11434/v1/responses
agent.model.name=qwen3.5:9b
agent.model.token=
agent.model.timeout=120s

# 上下文窗口、普通回复和摘要的输出预算，单位均为 token。
agent.context.window=32768
agent.context.answer-tokens=8192
agent.context.summary-tokens=4096
