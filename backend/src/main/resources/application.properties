spring.application.name=data-agent-v3
# 使用独立端口，方便与 V2 同时运行。
server.port=8083
# 本地沿用 Compose 的数据库账号，密码由环境注入。
spring.datasource.url=${AGENT_DB_URL:jdbc:postgresql://localhost:5432/data_agent_v3}
spring.datasource.username=${AGENT_DB_USER:data_agent}
spring.datasource.password=${AGENT_DB_PASSWORD:${POSTGRES_PASSWORD:}}
